name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Real Postgres (with pgvector) for src/server/postgres.test.ts: migration locking and the
      # production database driver. Throwaway CI credentials, not a secret.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Integration tests (PGlite + real Postgres)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Client bundle secret check
        run: npm run check:secrets

  container:
    name: Container image (build and role smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Builds the image and checks the migrate, web and worker roles against Postgres.
    # Nothing is pushed or deployed.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t brandpilot:ci web

      - name: Staging configuration for the role checks
        # Throwaway values generated per run (no secrets in the repository). The image defaults to
        # DEPLOY_ENV=production, so every role below runs with the strict checks.
        run: |
          {
            echo "DEPLOY_ENV=staging"
            echo "DATABASE_URL=$DB"
            echo "APP_SECRET=$(openssl rand -hex 32)"
            echo "APP_URL=https://staging.example.com"
            echo "AI_PROVIDER=mock"
            echo "AI_ALLOW_MOCK_IN_PRODUCTION=true"
            echo "STORAGE_DIR=/tmp/store"
            echo "ALLOW_LOCAL_STORAGE_IN_PRODUCTION=true"
            echo "TRUSTED_PROXY_HOPS=1"
            echo "RUN_JOBS_IN_PROCESS=false"
          } > "$RUNNER_TEMP/staging.env"

      - name: Web never migrates at start-up (fresh database stays un-migrated and not ready)
        run: |
          docker run --rm --network host pgvector/pgvector:pg16 psql "$DB" -c "create database fresh"
          FRESH="${DB%/*}/fresh"
          docker run -d --name web-fresh --network host --env-file "$RUNNER_TEMP/staging.env" -e DATABASE_URL="$FRESH" -e PORT=3001 brandpilot:ci
          for i in $(seq 1 60); do curl -fs -o /dev/null localhost:3001/api/health/live && break; sleep 2; done
          code=$(curl -s -o ready.json -w '%{http_code}' localhost:3001/api/health/ready); cat ready.json; echo
          test "$code" = "503"
          grep -q '"migrations":{"ok":false' ready.json
          test "$(docker run --rm --network host pgvector/pgvector:pg16 psql "$FRESH" -tAc "select to_regclass('public.users') is null")" = "t"
          docker stop -t 30 web-fresh

      - name: Migrate (two concurrent runs, advisory lock)
        run: |
          docker run --rm --network host --env-file "$RUNNER_TEMP/staging.env" brandpilot:ci migrate &
          docker run --rm --network host --env-file "$RUNNER_TEMP/staging.env" brandpilot:ci migrate &
          wait

      - name: Web role in strict staging mode is ready
        run: |
          docker run -d --name web --network host --env-file "$RUNNER_TEMP/staging.env" -e PORT=3000 brandpilot:ci
          for i in $(seq 1 60); do curl -fs -o /dev/null localhost:3000/api/health/live && break; sleep 2; done
          curl -fsS localhost:3000/api/health/ready
          curl -fsI localhost:3000/login | grep -i "x-frame-options: DENY"
          docker stop -t 30 web
          test "$(docker inspect -f '{{.State.ExitCode}}' web)" = "0"

      - name: Worker role shuts down gracefully on SIGTERM
        run: |
          docker run -d --name worker --network host --env-file "$RUNNER_TEMP/staging.env" brandpilot:ci worker
          for i in $(seq 1 60); do docker logs worker 2>&1 | grep -q '"worker.started"' && break; sleep 1; done
          docker stop -t 30 worker
          docker logs worker 2>&1 | grep '"worker.stopped"'
          test "$(docker inspect -f '{{.State.ExitCode}}' worker)" = "0"

      - name: Demo mode with the image's default data folder (embedded database, local storage)
        run: |
          docker run -d --name demo --network host -e PORT=3002 -e DEPLOY_ENV=demo -e APP_SECRET="$(openssl rand -hex 32)" \
            -e AI_PROVIDER=mock -e AI_ALLOW_MOCK_IN_PRODUCTION=true brandpilot:ci
          for i in $(seq 1 60); do curl -fs -o /dev/null localhost:3002/api/health/live && break; sleep 2; done
          curl -fsS localhost:3002/api/health/ready
          docker stop -t 30 demo

      - name: Production refuses unsafe or missing configuration
        run: |
          refused() {
            set +e
            docker run --rm "$@" > out.log 2>&1
            code=$?
            set -e
            cat out.log
            test "$code" != "0"
            grep '"config.refused"' out.log
          }
          # DEPLOY_ENV not set at all: the image default (production) applies.
          refused -e AI_PROVIDER=mock brandpilot:ci migrate
          # A typo in DEPLOY_ENV fails closed.
          refused -e DEPLOY_ENV=prod brandpilot:ci migrate
          # Local disk without the explicit opt-in, and migrations at start-up, are refused.
          refused --env-file "$RUNNER_TEMP/staging.env" -e DEPLOY_ENV=production -e AI_PROVIDER= -e AI_ALLOW_MOCK_IN_PRODUCTION= -e ANTHROPIC_API_KEY=placeholder -e ALLOW_LOCAL_STORAGE_IN_PRODUCTION= brandpilot:ci migrate
          grep -q '"STORAGE_DRIVER"' out.log
          refused --env-file "$RUNNER_TEMP/staging.env" -e DEPLOY_ENV=production -e AI_PROVIDER= -e AI_ALLOW_MOCK_IN_PRODUCTION= -e ANTHROPIC_API_KEY=placeholder -e MIGRATE_ON_START=true brandpilot:ci migrate
          grep -q '"MIGRATE_ON_START"' out.log
